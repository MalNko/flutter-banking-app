name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8

  # AWS Amplify Dependencies
  amplify_flutter: ^1.7.0
  amplify_auth_cognito: ^1.7.2
  amplify_storage_s3: ^1.2.0
  amplify_api: ^1.7.0
  amplify_datastore: ^1.2.0
  amplify_analytics_pinpoint: ^1.2.0

  # Charts & Graphs
  fl_chart: ^0.70.2

  # Networking & API Calls
  http: ^1.2.0

  # State Management
  provider: ^6.1.0

  # Local & Secure Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Date Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
